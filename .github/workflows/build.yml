name: Build and dedicated smoke

on:
  push:
    branches: [codex/neoforge-26.2]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: bash ./gradlew build testmodJar --no-daemon --max-workers=2 --console=plain
      - name: Boot isolated NeoForge server twice
        run: node src/test/node/server-smoke.mjs
