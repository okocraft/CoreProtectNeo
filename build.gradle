plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = neo_version
    runs {
        server {
            server()
            programArgument '--nogui'
            jvmArgument '-Xmx2G'
        }
    }
    mods { coreprotect { sourceSet sourceSets.main } }
}

repositories {
    mavenCentral()
}

dependencies {
    jarJar(implementation("org.xerial:sqlite-jdbc:${sqlite_version}")) {
        version { strictly "[${sqlite_version},4.0)"; prefer sqlite_version }
    }
    jarJar(implementation("com.mysql:mysql-connector-j:${mysql_version}")) {
        version { strictly "[${mysql_version},10.0)"; prefer mysql_version }
    }
    jarJar(implementation("com.zaxxer:HikariCP:${hikari_version}")) {
        version { strictly "[${hikari_version},8.0)"; prefer hikari_version }
    }
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

test { useJUnitPlatform(); testLogging { exceptionFormat = 'full' } }

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

sourceSets {
    testmod {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}
tasks.register('testmodJar', Jar) {
    from sourceSets.testmod.output
    archiveFileName = 'coreprotect-test.jar'
    destinationDirectory = layout.buildDirectory.dir('testmods')
}
